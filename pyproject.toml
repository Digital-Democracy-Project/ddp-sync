[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ddp-sync"
version = "0.1.0"
description = "DDP unified data pipeline service"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",

    # Scheduler
    "APScheduler>=3.10.4",

    # Vector store + embeddings
    "pinecone>=5.0.0",
    "openai>=1.10.0",
    "tenacity>=8.0.0",

    # Data extraction
    "pdfplumber>=0.10.0",
    "PyPDF2>=3.0.0",
    "beautifulsoup4>=4.12.0",
    "tiktoken>=0.5.0",

    # External APIs
    "httpx>=0.26.0",
    "requests>=2.31.0",

    # Config + infra
    "boto3>=1.34.0",
    "redis>=5.0.0",
    # OPEN-275: the one-off RDS dispatch-time freshness-query connection (plan
    # §3.4 item 3, §7.7) -- ddp-sync has no other direct Postgres client anywhere
    # else (every other DB access is either HTTP-mediated via api-v3, or a
    # DATABASE_URL handed to a separate Fargate task's own process). asyncpg
    # over psycopg2 to match this codebase's existing async-first style
    # (httpx.AsyncClient throughout) rather than needing a thread-pool wrapper.
    "asyncpg>=0.29.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "pyyaml>=6.0",

    # Voatz/Brevo pipeline (Phase 2)
    "email-validator>=2.0.0",

]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
