# VoteBot Sync Schedule Configuration
# ====================================
#
# Controls when bills, legislators, and organizations are synced.
# Activated by setting SCHEDULER_ENABLED=true in the environment.
# In multi-worker deployments, only one worker runs the scheduler
# (Redis-based leader election).
#
# Schedule Summary:
# - Bill versions:  Daily at 04:00 UTC (checks for newer amended versions, re-ingests if changed)
# - Legislators:    Weekly on Sundays at 06:00 UTC
# - Organizations:  Monthly on the 1st at 08:00 UTC
#
# Session Detection:
# - Primary: Live session dates from OpenStates API (fetched via warm_cache()
#   during bill sync — uses existing OpenStatesSource.fetch_jurisdiction())
# - Fallback: Hardcoded heuristics in StateLegislativeCalendar (start pattern
#   + duration in weeks for all 50 states)

# Global settings (legacy — prefer bill_sync block below)
sync_time_utc: "04:00"  # Fallback if bill_sync.sync_time_utc is not set

# Daily bill sync — shared OpenStates fetch, independent write paths
bill_sync:
  sync_time_utc: "04:00"  # 4 AM UTC = 11 PM EST

  # Flow 1: OpenStates → Webflow CMS (status, status-date, status-chamber, gov-url)
  webflow_status:
    enabled: true

  # Flow 2: OpenStates → Pinecone (bill text re-ingestion on new versions)
  version_check:
    enabled: true
    max_updates_per_run: 0  # 0 = unlimited

# Federal Congress settings (not covered by StateLegislativeCalendar)
US:
  enabled: true
  frequency: daily
  congress_number: 119        # 119th Congress (2025-2027)
  session_years: "2025-2027"

# DDP Active Jurisdictions (seed list)
# New states are auto-tracked when bills are synced via the unified sync API.
# The canonical set is maintained in Redis (votebot:active_jurisdictions).
# This list seeds the Redis set and serves as documentation of initial states.
active_jurisdictions:
  - FL   # Florida
  - VA   # Virginia
  - WA   # Washington
  - UT   # Utah
  - AZ   # Arizona
  - MI   # Michigan
  - MA   # Massachusetts

# Jurisdiction Overrides
# Use this section to customize sync behavior for specific states.
# If not listed here, the default behavior applies:
#   - In session: sync daily
#   - Off session: sync weekly (Mondays only)
#   - Biennial off-year: no sync
overrides:
  # Example: Disable a jurisdiction temporarily
  # NV:
  #   enabled: false
  #   reason: "Not yet supported in DDP"

  # Example: Force weekly sync even during session
  # CA:
  #   frequency: weekly
  #   reason: "High volume, reduce API calls"

# Rate Limiting
# OpenStates API Tier: 30,000 calls/day, 2 calls/second
# 2 calls/sec = 120 requests/minute = 500ms minimum between requests
rate_limit:
  requests_per_minute: 120
  delay_between_bills_ms: 500

# Retry Configuration
retry:
  max_attempts: 3
  backoff_seconds: 5

# Legislator Sync Configuration
# Syncs sponsored bills and voting records for each legislator from OpenStates.
# Runs weekly to spread API usage. Uses date-based rotation to cycle through
# all legislators over multiple runs (max_legislators_per_run per week).
legislator_sync:
  enabled: true
  sync_time_utc: "06:00"  # 6 AM UTC = 1 AM EST (2 hours after bill sync)
  frequency: weekly        # Weekly sync to conserve API quota
  sync_day: sunday         # Run on Sundays
  # Rate limiting (aligned with API tier: 2 calls/second)
  delay_between_legislators_ms: 500   # 500ms between legislators (2 calls/sec)
  max_legislators_per_run: 200        # Rotate through full list across weeks

  # Sponsored bills sync
  sync_sponsored_bills: true

  # Voting record sync
  sync_votes: true
  max_vote_bills_per_legislator: 200  # Max bills to check for votes per legislator
  vote_session: null                   # null = current session, or specify e.g. "2026"

# Legislator Bio + Contact Sync Configuration
# Syncs biographical and contact data into the existing Webflow Legislators
# CMS. Federal: unitedstates/congress-legislators YAML (free). State:
# OpenStates /people. See plans/PLAN-legislator-bio-sync.md.
#
# Phase-1 federal sync was shipped manually 2026-04-30. State-leg sync
# landed shortly after. The schedule is enabled: false by default — flip
# to true after editor verification + a monitoring window. auto_create
# stays false by default even when enabled (auto-create discovery is
# additionally gated by per-jurisdiction config).
legislator_bio_sync:
  enabled: true                 # enabled 2026-05-01 (post Phase-1+2.5+3+4 + editor sign-off)
  sync_time_utc: "07:00"        # after bill sync (04:00) + OpenStates leg sync (06:00)
  frequency: weekly
  sync_day: sunday
  jurisdiction: null            # null = all jurisdictions; or "us" / state code
  auto_create: false            # gated independently of `enabled`
  historical_since: "2023-01-01"
  target: all                   # all / webflow / pinecone

  # Phase-3 photo upload pipeline (production-verified 2026-04-30 →
  # editor-signed-off 2026-05-01). When true, the orchestrator uploads
  # source images to Webflow's asset library and populates the
  # legislator-image (Image type) field. Requires
  # webflow_assets_read_write_key in the secret with assets:read +
  # assets:write scopes. Operator flips after stable monitoring window;
  # the cardinal rule preserves existing legislator-image values, so
  # weekly runs only upload for records that lost their photo or are
  # newly added.
  upload_photos: true           # enabled 2026-05-01 (key configured + 96.4% prod coverage verified)

  # Phase-3 connectivity smoke variant: fetches + size-validates +
  # hashes the source image but skips Webflow asset creation. Useful
  # for one-off "is the source CDN reachable" runs without consuming
  # Webflow's asset rate limit. No-op when upload_photos is false.
  upload_photos_dry_run: false

  # Phase-3 validation flag. When true, any payload field that the
  # schema cache would silently drop (slug missing from the live CMS
  # collection) becomes a per-record error. Operator flips this true
  # after adding a new write target so missing slugs surface
  # immediately instead of silently no-op'ing for a week.
  strict_schema: false

# Legacy alias (deprecated, use legislator_sync instead)
legislator_bills:
  enabled: false  # Disabled — superseded by legislator_sync above
  sync_time_utc: "06:00"
  frequency: weekly
  sync_day: sunday
  delay_between_legislators_ms: 500
  max_legislators_per_run: 200

# Organization Sync Configuration
# Re-ingests all organization profiles from Webflow CMS.
# Monthly is sufficient since org data changes infrequently.
organization_sync:
  enabled: true
  sync_time_utc: "08:00"  # 8 AM UTC = 3 AM EST (4 hours after bill sync)
  day_of_month: 1          # 1st of each month

# Bill Version Check Configuration
# Checks OpenStates for newer amended versions (Engrossed, Enrolled, etc.)
# and re-ingests bill text (PDF or HTML) into Pinecone when a new version
# is found. Also updates the gov-url field in Webflow CMS.
bill_version_check:
  max_updates_per_run: 0      # 0 = unlimited (memory-safe with per-bill gc + incremental embedding)
  skip_webflow_update: false  # Set true to disable CMS writes (testing)

# Notification Settings (future use)
notifications:
  on_failure: true
  on_large_changes: true  # Alert if >100 bills updated
  email: ""  # Configure if needed

# API Health Check
# Runs nightly against all configured Voatz orgs via /get_events.
# Posts a Zapier alert (slack_message field) on any failures.
# Manual trigger: .venv/bin/python scripts/check_api_health.py [--dry-run]
api_health_check:
  # enabled: true  # Disabled — DDP_API_KEY not yet configured in DDP-Sync's Secrets Manager secret.
  #                # The health check sends no Authorization header when this key is missing,
  #                # causing 401s on all /get_events checks. Fix: issue a read-scoped managed key
  #                # via POST /admin/keys, store it as ddp_api_key in ddp-sync/credentials, then re-enable.
  sync_time_utc: "09:00"   # after bill (04:00), leg (06:00), bio (07:00) syncs

# OpenStates Scrape Schedule
# ==========================
#
# Replaces the ad-hoc run-all-scrapes.sh launchd job. Each jurisdiction is an
# independent APScheduler job so a long-running FL scrape (12+ hours) no longer
# delays WA, USA, or the Sunday secondary-state jobs.
#
# Cutover: disable the launchd com.ddp.openstates-scraper plist before enabling
# this block, or both will run simultaneously and conflict.
#
# Schedule (UTC):
#   01:00 daily   — patch refresh (apply-local-patches.sh)
#   02:00 daily   — FL (all sessions, sequential), WA, USA (parallel with FL)
#   02:00 Sunday  — VA, MI, MA, UT, AZ (concurrent, independent _data/ dirs)
#   10:00 Sunday  — people refresh (after secondary scrapes complete)
openstates_scrape:
  enabled: true
  openstates_root: "/Users/agentsmith/Developer/repos/ddp-open-states"

  patch_refresh:
    enabled: true
    sync_time_utc: "01:00"

  primary:
    sync_time_utc: "02:00"

    fl:
      enabled: true
      sessions:
        - "2026"
        - "2026D"
        - "2026E"
        - "2026F"

    wa:
      enabled: true

    usa:
      enabled: true
      sessions:
        - "119 chamber=lower"
        - "119 chamber=upper"

  secondary:
    enabled: true
    sync_day: sunday
    sync_time_utc: "02:00"
    jurisdictions:
      - va
      - mi
      - ma
      - ut
      - az

  people_refresh:
    enabled: true
    sync_day: sunday
    sync_time_utc: "10:00"

# VoteBot Eval Cron (plan PLAN-eval-and-cache-hit-logging.md §3)
# Runs scripts/evaluate_production.py weekly via subprocess into votebot's
# venv. Posts a Zapier alert with on_failure / on_regression /
# on_bill_history_leak flags that the Zap routes to Slack on receiver side.
# Manual trigger: POST /ddp-sync/v1/trigger/votebot-eval?days=7
votebot_eval:
  enabled: true
  frequency: weekly                  # weekly only — eval is expensive
  sync_day: sunday                   # Sunday early UTC = Saturday evening EST
  sync_time_utc: "12:00"
  days: 7                            # window passed to --days
  max_days: 30                       # hard cap accepted by manual trigger
  votebot_path: "/home/ubuntu/votebot"  # env VOTEBOT_PATH overrides this
  thresholds:
    # Set below current production baselines so first run isn't a false
    # positive. Tighten as Deploy 2 (citation prompt) lifts the baseline.
    citation_rate_floor: 0.20        # alert when citation_rate < this
    pass_rate_floor: 0.40            # alert when pass_rate < this
    delta_drop_pp: 10                # soft-alert when either rate drops by ≥ this many pp
  notifications:
    enabled: true                    # set false to suppress Zapier alerts
    alert_on_success: true           # send the green-path summary too, not just failures
