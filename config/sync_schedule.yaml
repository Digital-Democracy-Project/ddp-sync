# VoteBot Sync Schedule Configuration
# ====================================
#
# Controls when bills, legislators, and organizations are synced.
# Activated by setting SCHEDULER_ENABLED=true in the environment.
# In multi-worker deployments, only one worker runs the scheduler
# (Redis-based leader election).
#
# Schedule Summary:
# - Bill versions:  Daily at 04:00 UTC (checks for newer amended versions, re-ingests if changed)
# - Legislators:    Weekly on Sundays at 06:00 UTC
# - Organizations:  Monthly on the 1st at 08:00 UTC
#
# Session Detection:
# - Primary: Live session dates from OpenStates API (fetched via warm_cache()
#   during bill sync — uses existing OpenStatesSource.fetch_jurisdiction())
# - Fallback: Hardcoded heuristics in StateLegislativeCalendar (start pattern
#   + duration in weeks for all 50 states)

# Global settings (legacy — prefer bill_sync block below)
sync_time_utc: "04:00"  # Fallback if bill_sync.sync_time_utc is not set

# Daily bill sync — shared OpenStates fetch, independent write paths
bill_sync:
  sync_time_utc: "04:00"  # 4 AM UTC = 11 PM EST

  # Flow 1: OpenStates → Webflow CMS (status, status-date, status-chamber, gov-url)
  webflow_status:
    enabled: true

  # Flow 2: OpenStates → Pinecone (bill text re-ingestion on new versions)
  version_check:
    enabled: true
    max_updates_per_run: 0  # 0 = unlimited

# Federal Congress settings (not covered by StateLegislativeCalendar)
US:
  enabled: true
  frequency: daily
  congress_number: 119        # 119th Congress (2025-2027)
  session_years: "2025-2027"

# DDP Active Jurisdictions (seed list)
# New states are auto-tracked when bills are synced via the unified sync API.
# The canonical set is maintained in Redis (votebot:active_jurisdictions).
# This list seeds the Redis set and serves as documentation of initial states.
active_jurisdictions:
  - FL   # Florida
  - VA   # Virginia
  - WA   # Washington
  - UT   # Utah
  - AZ   # Arizona
  - MI   # Michigan
  - MA   # Massachusetts

# Jurisdiction Overrides
# Use this section to customize sync behavior for specific states.
# If not listed here, the default behavior applies:
#   - In session: sync daily
#   - Off session: sync weekly (Mondays only)
#   - Biennial off-year: no sync
overrides:
  # Example: Disable a jurisdiction temporarily
  # NV:
  #   enabled: false
  #   reason: "Not yet supported in DDP"

  # Example: Force weekly sync even during session
  # CA:
  #   frequency: weekly
  #   reason: "High volume, reduce API calls"

# Rate Limiting
# OpenStates API Tier: 30,000 calls/day, 2 calls/second
# 2 calls/sec = 120 requests/minute = 500ms minimum between requests
rate_limit:
  requests_per_minute: 120
  delay_between_bills_ms: 500

# Retry Configuration
retry:
  max_attempts: 3
  backoff_seconds: 5

# Legislator Sync Configuration
# Syncs sponsored bills and voting records for each legislator from OpenStates.
# Runs weekly to spread API usage. Uses date-based rotation to cycle through
# all legislators over multiple runs (max_legislators_per_run per week).
legislator_sync:
  enabled: true
  sync_time_utc: "06:00"  # 6 AM UTC = 1 AM EST (2 hours after bill sync)
  frequency: weekly        # Weekly sync to conserve API quota
  sync_day: sunday         # Run on Sundays
  # Rate limiting (aligned with API tier: 2 calls/second)
  delay_between_legislators_ms: 500   # 500ms between legislators (2 calls/sec)
  max_legislators_per_run: 200        # Rotate through full list across weeks

  # Sponsored bills sync
  sync_sponsored_bills: true

  # Voting record sync
  sync_votes: true
  max_vote_bills_per_legislator: 200  # Max bills to check for votes per legislator
  vote_session: null                   # null = current session, or specify e.g. "2026"

# Legislator Bio + Contact Sync Configuration
# Syncs biographical and contact data into the existing Webflow Legislators
# CMS. Federal: unitedstates/congress-legislators YAML (free). State:
# OpenStates /people. See plans/PLAN-legislator-bio-sync.md.
#
# Phase-1 federal sync was shipped manually 2026-04-30. State-leg sync
# landed shortly after. The schedule is enabled: false by default — flip
# to true after editor verification + a monitoring window. auto_create
# stays false by default even when enabled (auto-create discovery is
# additionally gated by per-jurisdiction config).
legislator_bio_sync:
  enabled: true                 # enabled 2026-05-01 (post Phase-1+2.5+3+4 + editor sign-off)
  sync_time_utc: "07:00"        # after bill sync (04:00) + OpenStates leg sync (06:00)
  frequency: weekly
  sync_day: sunday
  jurisdiction: null            # null = all jurisdictions; or "us" / state code
  auto_create: false            # gated independently of `enabled`
  historical_since: "2023-01-01"
  target: all                   # all / webflow / pinecone

  # Phase-3 photo upload pipeline (production-verified 2026-04-30 →
  # editor-signed-off 2026-05-01). When true, the orchestrator uploads
  # source images to Webflow's asset library and populates the
  # legislator-image (Image type) field. Requires
  # webflow_assets_read_write_key in the secret with assets:read +
  # assets:write scopes. Operator flips after stable monitoring window;
  # the cardinal rule preserves existing legislator-image values, so
  # weekly runs only upload for records that lost their photo or are
  # newly added.
  upload_photos: true           # enabled 2026-05-01 (key configured + 96.4% prod coverage verified)

  # Phase-3 connectivity smoke variant: fetches + size-validates +
  # hashes the source image but skips Webflow asset creation. Useful
  # for one-off "is the source CDN reachable" runs without consuming
  # Webflow's asset rate limit. No-op when upload_photos is false.
  upload_photos_dry_run: false

  # Phase-3 validation flag. When true, any payload field that the
  # schema cache would silently drop (slug missing from the live CMS
  # collection) becomes a per-record error. Operator flips this true
  # after adding a new write target so missing slugs surface
  # immediately instead of silently no-op'ing for a week.
  strict_schema: false

# Legacy alias (deprecated, use legislator_sync instead)
legislator_bills:
  enabled: false  # Disabled — superseded by legislator_sync above
  sync_time_utc: "06:00"
  frequency: weekly
  sync_day: sunday
  delay_between_legislators_ms: 500
  max_legislators_per_run: 200

# Organization Sync Configuration
# Re-ingests all organization profiles from Webflow CMS.
# Monthly is sufficient since org data changes infrequently.
organization_sync:
  enabled: true
  sync_time_utc: "08:00"  # 8 AM UTC = 3 AM EST (4 hours after bill sync)
  day_of_month: 1          # 1st of each month

# Bill Version Check Configuration
# Checks OpenStates for newer amended versions (Engrossed, Enrolled, etc.)
# and re-ingests bill text (PDF or HTML) into Pinecone when a new version
# is found. Also updates the gov-url field in Webflow CMS.
bill_version_check:
  max_updates_per_run: 0      # 0 = unlimited (memory-safe with per-bill gc + incremental embedding)
  skip_webflow_update: false  # Set true to disable CMS writes (testing)

# Notification Settings (future use)
notifications:
  on_failure: true
  on_large_changes: true  # Alert if >100 bills updated
  email: ""  # Configure if needed

# API Health Check
# Runs nightly against all configured Voatz orgs via /get_events.
# Posts a Zapier alert (slack_message field) on any failures.
# Manual trigger: .venv/bin/python scripts/check_api_health.py [--dry-run]
api_health_check:
  # enabled: true  # Disabled — DDP_API_KEY not yet configured in DDP-Sync's Secrets Manager secret.
  #                # The health check sends no Authorization header when this key is missing,
  #                # causing 401s on all /get_events checks. Fix: issue a read-scoped managed key
  #                # via POST /admin/keys, store it as ddp_api_key in ddp-sync/credentials, then re-enable.
  sync_time_utc: "09:00"   # after bill (04:00), leg (06:00), bio (07:00) syncs

# OpenStates Scrape Schedule
# ==========================
#
# Replaces the ad-hoc run-all-scrapes.sh launchd job. Each jurisdiction is an
# independent APScheduler job so a long-running FL scrape (12+ hours) no longer
# delays WA, USA, or the Sunday secondary-state jobs.
#
# Cutover: disable the launchd com.ddp.openstates-scraper plist before enabling
# this block, or both will run simultaneously and conflict.
#
# Schedule (UTC) — staggered to avoid simultaneous starts and spread Mac load:
#
#   Daily:
#   01:00  patch refresh (apply-local-patches.sh)
#   02:00  FL (all sessions sequential — 12+ hours, starts first)
#   02:30  WA (~5 hours)
#   03:00  USA lower → upper (~6 hours; shares slot with Mon Webflow batch, no conflict)
#   04:00  bill sync [existing]
#
#   Sunday additionally:
#   02:00  VA, MI, MA, UT, AZ (concurrent, independent _data/ dirs; alongside FL start)
#   06:00  legislator sync [existing]
#   07:00  bio sync [existing]
#   10:00  people refresh (USA finishes ~09:00, safe margin)
#   12:00  votebot eval [existing — FL still running but different resources]
openstates_scrape:
  enabled: true
  openstates_root: "/Users/agentsmith/Developer/repos/ddp-open-states"

  # OPEN-86: import-as-you-go. run-scrape.sh normally imports into Postgres once, at the very
  # end, and the next --scrape wipes $STATE_DATADIR first -- so a run killed partway through
  # loses everything it had collected. That is not theoretical: FL 213 + MA 473 bills went that
  # way on 2026-07-30, and again in SYNC-35, where a ddp-sync restart orphaned AZ's run after it
  # had successfully scraped all 895 bills. With the sweep on, a periodic in-run import lands
  # bills as they are scraped, so a death mid-scrape keeps whatever already went in.
  #
  # The mechanism has been merged but dark since 2026-07-30 -- run-scrape.sh reads
  # SWEEP_IMPORT_ENABLED and nothing set it. This is the gate.
  #
  # Rolled out per jurisdiction on purpose. VA ONLY for the first cycle, per
  # PLAN-incremental-scraping.md's own rollout condition ("run the VA *or* UT canary first" —
  # singular), before UT and then FL/MA/USA.
  #
  # Why one and not both: the secondary-states job fans its five jurisdictions out with
  # asyncio.gather, so VA and UT start simultaneously (confirmed live 2026-08-22 — both at
  # 22:00:00), and run-scrape.sh's import lock is keyed per SCRAPE_KEY so they would NOT
  # serialise. Enabling both would make the very first canary a test of two concurrent
  # sweep-imports against the same Postgres, which conflates "does the sweep work" with "does
  # sweep contention work". VA alone answers the first question; add UT for the second.
  #
  # VA rather than UT because VA is currently healthy (124s run 2026-08-22) while UT is only
  # just recovering from OPEN-106's get_session_list() failure — don't canary on the one that
  # was broken last week.
  #
  # Add a jurisdiction here only after watching a clean cycle for the ones already listed.
  # Both run weekly, so each cycle costs a week of calendar time.
  #
  # Product sign-off obtained 2026-08-22 (Ramon) on the one question this actually turned on:
  # consumers (api-v3, dashboards) MAY see a jurisdiction mid-update rather than a consistent
  # end-of-run snapshot. The trade was judged worth it -- a reader seeing a half-updated
  # jurisdiction for a few minutes costs less than losing an entire run's work.
  #
  # Read by _sweep_import_eligible() in pipelines/openstates_scrape.py, which sets
  # SWEEP_IMPORT_ENABLED=1 in run-scrape.sh's environment. Shape mirrors
  # secondary.scrapebot_fallback below.
  #
  # Rollback: set enabled: false, or empty the list. Note precisely what that does and does
  # not do -- it stops SWEEP_IMPORT_ENABLED being injected into FUTURE runs. It does not revert
  # bills a sweep already imported, and it does not stop an in-flight run. To stop a run in
  # progress you have to kill the run itself.
  sweep_import:
    enabled: true
    jurisdictions: ["va"]   # UT next, after one clean VA cycle

  # OPEN-162: periodic forced FULL walk, the backstop MI's incremental filter was documented as
  # having and did not.
  #
  # run-scrape.sh full-walks only when logs/last-run/<key>.ts is absent, and nothing in
  # production ever removed one. So MI had exactly one full walk -- when the marker was first
  # absent -- and every run since has been incremental against the previous run's snapshot.
  # OPEN-158 measured what that misses: ~1.2% of bills sit behind a repeated last-action string
  # that hides real intervening actions (adopted substitutes, committee reports, floor
  # referrals; one bill had 25 actions behind a single repeated string). Tolerable only if
  # something eventually re-reads every bill, which nothing did.
  #
  # MI only, for now. This is not free: a full walk is ~3,924 bills against a hard 10
  # requests/minute WAF cap, so ~6.5 hours, on the fleet's most WAF-sensitive site. That is why
  # MI also has its own 10h entry in SCRAPE_TIMEOUT_S -- the 6h default would have killed it
  # just short of finishing. Do not add a jurisdiction here without checking its ceiling first.
  #
  # interval_days is a floor, not a calendar: the check is "has it been >= this long since the
  # last forced walk", evaluated when a scrape is about to start. A missed or failed run does
  # not skip the cycle -- the next scrape still finds it due.
  #
  # Rollback: set enabled: false, or empty the list. That stops FUTURE runs being promoted to
  # full walks. It does not stop an in-flight walk; kill the run itself for that.
  #
  # SHIPPING DISABLED, deliberately. The mechanism is complete and safe -- a forced walk that
  # dies partway now gives its watermark back, so a failure costs one wasted run rather than
  # stranding MI in full-walk mode. What is not established is that an MI full walk can finish
  # at all: the one attempt (2026-08-26 00:07) died at 03:56 when its WAF cookie re-warm hit
  # ERR_SOCKET_NOT_CONNECTED, and that failure mode is still open as OPEN-173. Arming a monthly
  # walk we have watched fail would spend ~4h of WAF-capped requests and a failure alert every
  # 30 days to learn nothing new.
  #
  # To turn on: fix OPEN-173, complete one full walk, record its real duration, confirm the
  # SCRAPE_TIMEOUT_S["mi"] ceiling against that measurement rather than the ~6.5h estimate
  # (this module requires >=1.5x a MEASURED walk for MA, and MI is more variable, not less),
  # then set enabled: true. See OPEN-162.
  full_walk:
    enabled: false
    jurisdictions: ["mi"]
    interval_days: 30

  # OPEN-87: bounded retry of a whole scrape run. These are weekly jobs, so a run killed by a
  # transient fault currently waits a week for its next attempt -- that is what happened to MA
  # on 2026-08-01, a network timeout on a run that would have succeeded on a re-run. When a
  # jurisdiction is opted in here, ddp-sync invokes run-scrape-retrying.sh instead of
  # run-scrape.sh; that wrapper re-runs the scrape a fixed number of times and lets
  # run-scrape.sh alert exactly once, at the end, instead of once per attempt.
  #
  # MA ONLY for the first cycle. The ticket says "MA/USA-first", and MA is not in question --
  # it is the jurisdiction the 2026-08-01 incident happened to. USA is deliberately held back
  # for one cycle on arithmetic, not taste: SCRAPE_TIMEOUT_S["usa"] is 4h, the tightest ceiling
  # of any named jurisdiction (fl 16h, wa 8h, ma falls to the 6h default). Three attempts plus
  # 45 minutes of backoff has to fit inside that whole ceiling, so a USA session averaging much
  # over an hour cannot complete its third attempt before ddp-sync kills the invocation. That
  # makes USA the worst possible first canary: a kill mid-attempt would look like the retry
  # design failing when it was really the timeout interaction (open question 2 on OPEN-87).
  # Add USA once that question is settled, or once its timeout is raised.
  #
  # A jurisdiction not listed here is invoked exactly as it is today: same script, same
  # arguments, no wrapper process at all.
  #
  # "One clean cycle" before widening means, concretely: the run completed without being killed
  # by SCRAPE_TIMEOUT_S; exactly one failure alert per genuinely-failed run and none for a run
  # that recovered on a later attempt; and total runtime still inside the ceiling with the
  # backoff included.
  #
  # jurisdictions_excluded is not redundant with the allowlist, it outlives it. When the
  # rollout finishes and someone widens `jurisdictions` (plausibly to every jurisdiction),
  # this is the line that still keeps MI out. MI must never be retried: OPEN-53 established
  # that a blind retry against a WAF worsens a block rather than recovering from it, because
  # each attempt is more traffic from an already-suspect client. MI is the jurisdiction that
  # gets WAF-blocked (it is why secondary.scrapebot_fallback below lists exactly ["mi"]).
  #
  # backoff_secs is the wait before each *re*try; the last value repeats if there are more
  # retries than values. So [900, 900] is fixed 15m and [900, 1800, 3600] is growing 15/30/60 --
  # the shape is a config edit, not a code change.
  #
  # THE VALUES BELOW ARE A PLACEHOLDER, NOT A DECISION. 3 attempts at 900,1800 covers a
  # 45-minute window, and the MA failure this exists to catch only manifested after roughly
  # five hours -- so this configuration would not have caught the very incident that motivated
  # it. Whether the right answer is more attempts, much wider spacing, or something other than
  # a retry loop is an open question on OPEN-87 for the operator, deliberately left open here
  # rather than settled by whoever implemented the mechanism.
  #
  # Read by _retry_eligible() in pipelines/openstates_scrape.py. Shape mirrors
  # secondary.scrapebot_fallback below.
  #
  # Rollback: set enabled: false, or empty the list. That makes future runs invoke
  # run-scrape.sh directly again. It does not stop an in-flight wrapper -- to stop one that is
  # mid-backoff you have to kill the run itself.
  # Named scrape_retry, not retry: this file already has an unrelated TOP-LEVEL `retry:` block
  # (OpenStates API call retries, max_attempts/backoff_seconds). Same word, different thing, and
  # a reader skimming for "retry" should not have to work out which one they landed on.
  scrape_retry:
    enabled: true
    jurisdictions: ["ma"]             # USA next, after one clean MA cycle (see above)
    jurisdictions_excluded: ["mi"]    # never retry a WAF-blocked jurisdiction (OPEN-53)
    max_attempts: 3
    backoff_secs: [900, 1800]         # PLACEHOLDER pending the OPEN-87 backoff decision

  # OPEN-139: alert when a jurisdiction that was filing bills stops filing them.
  #
  # Reads run-scrape.sh's per-run `.imported` marker (ddp-open-states, same ticket) and folds the
  # new-bill count into the rolling per-jurisdiction history OPEN-22 already keeps in Redis. Two
  # independent checks then run over that one history: OPEN-22's WAF-block escalation, and this.
  #
  # Why a filing count and not the scrape's own file count: a scrape re-writes bills that have
  # not changed, so a frozen incremental cutoff looks perfectly healthy by file count. Arizona
  # wrote 895 files a night for 14 nights while importing nothing -- and the old <20%-drop
  # warning compared 895 against 895 every time and stayed silent. The import's new-bill count is
  # the number that actually goes to zero.
  #
  # DISABLED for the first cycle, deliberately. The check needs `quiet_window` runs of recorded
  # history before it can say anything at all, and these are weekly jobs, so there is nothing to
  # gain by having it live before the history exists -- and a real risk of it firing on the empty
  # state. Turn it on once the secondary jurisdictions have a few weeks of `bills_new` in their
  # history (visible in Redis under ddp:flow_history:openstates_secondary_scrapes:<juris>).
  #
  # quiet_window is consecutive MEASURED runs with zero new bills. Runs where the marker was
  # missing or the import report was unparseable are skipped, not counted as zeroes -- "we could
  # not measure" is not "nothing was filed". The check also requires evidence the jurisdiction
  # filed something earlier in its retained history, so an out-of-session state does not alert
  # every week all recess, and a jurisdiction we have never collected from does not alert forever.
  #
  # Deliberately not gated on is_in_session(): that has five confirmed false-negative paths
  # (OPEN-138), including four states reported out-of-session for all 365 days of 2026, so gating
  # on it would silently exempt whole jurisdictions. "It used to file and has stopped" needs no
  # calendar.
  #
  # WHEN TO TURN THIS ON. Data collection is already live with enabled: false -- every successful
  # run records its bills_new into the history regardless, so the history builds itself. Before
  # flipping this, confirm the two sides are actually talking to each other: the scrape logs must
  # be free of "no usable filing figures for a successful run" warnings (that warning names the
  # scrape_key and the exact path it looked for, so a mismatch is one `ls` away from settled), and
  # each of the five secondary jurisdictions needs at least quiet_window recorded runs -- i.e.
  # three weeks. Check with:
  #     redis-cli LRANGE ddp:flow_history:openstates_secondary_scrapes:va 0 -1
  # Rollback is this line back to false; it stops alerting and leaves the recorded history intact.
  #
  # WHAT IT WILL AND WILL NOT CATCH, so nobody mistakes it for full coverage:
  #   catches   a jurisdiction that was filing and has gone silent (the Arizona case)
  #   misses    a jurisdiction with no filing anywhere in its retained history that breaks just
  #             as its session opens -- silent until one positive run is seen. The alternative
  #             alerts every recess every week, which trains people to ignore it.
  #   misses    under-collection: 5 bills a week when it should be 85 looks healthy (OPEN-134).
  #
  # While a jurisdiction stays quiet this alerts once per run, not once per episode -- same
  # behaviour as the escalation block above, deliberately not a second different dedupe policy.
  #
  # Read by _check_sustained_blocking() in pipelines/openstates_scrape.py.
  filing_activity:
    enabled: false
    quiet_window: 3

  # OPEN-140: let a jurisdiction's scrape cadence follow observed filing activity instead of a
  # hand-edited sync_day. Florida currently carries this logic as a comment and a reminder --
  # "Remove sync_day (revert to daily) once the 2027 session opens" -- and if nobody remembers in
  # November, FL scrapes weekly through its entire session.
  #
  # THE FLOOR RULE (operator decision, 2026-08-23). Redis is the runtime source of truth; the
  # sync_day value in this file is a FLOOR, not a default to be overwritten. Automation may make
  # a jurisdiction run MORE often than this file says and never less. Nothing writes back to this
  # file -- a process editing its own config was considered and rejected. Losing Redis therefore
  # degrades to whatever is committed here, never to an unscheduled jurisdiction.
  #
  # ESCALATION IS AUTOMATIC, DEMOTION IS ONLY EVER ADVICE (same decision). The asymmetry is the
  # point: escalating wrongly costs a few extra scrapes, demoting wrongly costs data. "No new
  # bills" is exactly what a broken scraper looks like -- Arizona imported zero new bills across
  # ten consecutive runs because it was wedged, so a rule that demotes after a quiet stretch
  # would have demoted Arizona *because* it was broken, checking the broken thing less often.
  # OPEN-22 reached the same conclusion for WAF blocks and wrote it into the escalation block
  # below: it "deliberately does NOT skip or delay a scheduled run based on this history".
  #
  # So when a jurisdiction looks over-scraped this logs it and alerts, and changes nothing. Acting
  # on that advice is a human edit to sync_day here. If a later cycle wants automatic demotion,
  # the guards are already implemented and tested in scrape_cadence.demotion_looks_reasonable()
  # (quiet AND every run succeeded AND it has filed at some point) -- what is missing is the
  # decision, not the code.
  #
  # DISABLED for the first cycle. This needs OPEN-139's bills_new figures in the run history
  # before it can decide anything, and those only start accumulating when OPEN-139 ships. Enable
  # after a few weeks of history exist, the same check OPEN-139's own filing_activity block
  # describes.
  #
  # excluded: MI must never be escalated. OPEN-53 established that more traffic against a WAF
  # worsens a block, which is why MI is already excluded from scrape retries. Same key shape as
  # scrape_retry.jurisdictions_excluded above, on purpose.
  #
  # Read by scrape_cadence.py via the cadence-review job.
  # HOW IT TAKES EFFECT, and what "without a restart" actually means here. A daily review
  # job re-decides every jurisdiction's cadence, writes any escalation to Redis, and then
  # re-registers the scrape jobs in place. Startup deliberately does NOT read Redis: jobs
  # are registered from the floors in this file, and overrides arrive from the first review.
  # So a Redis outage cannot leave a jurisdiction unscheduled -- it can only mean the
  # committed cadence stays in force, which is the safe direction.
  #
  # Escalating a SECONDARY jurisdiction is a move, not a trigger edit. The secondary states
  # share one weekly job that fans out over a list; an escalated jurisdiction leaves that
  # list and gets its own nightly job (`openstates_secondary_scrape_<juris>`). Leaving it in
  # both would scrape it twice on the batch's day, and each run wipes the other's _data dir.
  # Its run history keeps the `openstates_secondary_scrapes` flow name in both cadences on
  # purpose -- that history is what the review reads, and splitting it on a cadence change
  # would erase the evidence that caused the change.
  #
  # review_time_utc sits before the day's first scrape (patch refresh 01:00, FL and secondary
  # 02:00), so a cadence decided this morning takes effect this morning rather than tomorrow.
  #
  # Where to see the live cadence: GET /schedule reports `openstates_cadence`, plus the jobs
  # themselves. That endpoint is not a nicety -- the floor rule puts the runtime cadence in
  # Redis, so it is no longer visible in a git diff and there would otherwise be no way to
  # answer "is Florida nightly right now?" short of a redis-cli.
  # BEFORE FLIPPING enabled TO true. Escalation increases scrape traffic, so this is the
  # one knob here worth checking rather than just setting.
  #   1. Confirm the history exists: each jurisdiction needs at least `escalate_window`
  #      runs carrying a bills_new figure, which on weekly jobs is a couple of weeks.
  #        redis-cli LRANGE ddp:flow_history:openstates_secondary_scrapes:va 0 -1
  #      OPEN-139's filing_activity block above describes the same check in more detail.
  #   2. Note the cadence you expect afterwards, then flip this and read GET /schedule --
  #      `openstates_cadence` reports what actually took effect, and a jurisdiction that
  #      escalated will have its own `openstates_secondary_scrape_<juris>` job.
  #   3. A cadence review runs a few minutes after startup as well as at review_time_utc,
  #      so you do not have to wait until tomorrow to see the result.
  # Rollback is this line back to false plus a restart: no review job is registered, so
  # nothing can escalate, and the schedule returns to the floors in this file. Any
  # override already in Redis is simply not consulted (registration never reads it);
  # DEL ddp:scrape_cadence:<juris> clears it for good.
  dynamic_cadence:
    enabled: false
    review_time_utc: "00:30"
    startup_review_delay_s: 300   # catch-up review after a restart, before the daily cron
    escalate_window: 2      # a productive run in the last N reviews -> nightly
    quiet_window: 4         # N quiet runs before demotion is even *suggested*
    jurisdictions_excluded: ["mi"]

  patch_refresh:
    enabled: true
    sync_time_utc: "01:00"

  primary:
    fl:
      enabled: true  # RE-ENABLED 2026-07-25 — was paused 2026-07-24 for the historical backfill
      # (2024 then 2023 regular sessions), which collided with this job's shared _data/fl folder.
      # Both sessions confirmed finished 2026-07-25 (2023 regular at 05:24 EDT, per
      # ddp-open-states's notes/fl-committee-org-resolution-gaps-20260725 branch) via a manual
      # run outside this scheduler — the logs/last-run/fl_session_<id>.ts marker this was
      # originally gated on never appeared (that directory doesn't exist; it's this very job
      # that would have created it), so re-enabling here is based on that external confirmation,
      # not the marker.
      sync_time_utc: "02:00"   # longest job — starts first
      # Weekly while FL is out of session — new draft bills aren't introduced
      # until ~November, so daily scrapes are wasted work and each one wipes
      # _data/fl on startup (colliding with historical backfills). Runs Sunday
      # 02:00 UTC alongside the secondary batch (independent _data/ dirs).
      # Remove sync_day (revert to daily) once the 2027 session opens.
      sync_day: sunday
      sessions:
        - "2026"
        - "2026D"
        - "2026E"
        - "2026F"

    wa:
      enabled: true
      sync_time_utc: "02:30"   # 30 min after FL; finishes ~07:30

    usa:
      enabled: true
      sync_time_utc: "03:00"   # 1 hour after FL; finishes ~09:00
      sessions:
        - "119 chamber=lower"
        - "119 chamber=upper"

  secondary:
    enabled: true
    sync_day: sunday
    sync_time_utc: "02:00"     # concurrent with FL start — independent _data/ dirs
    jurisdictions:
      - va
      - mi
      - ma
      - ut
      - az

    # Sustained-blocking escalation (OPEN-22). Nothing before this distinguished a first-time
    # WAF block from MI having been blocked for a month straight -- every weekly failure got
    # the same per-run alert either way. Checks each jurisdiction's own rolling history of the
    # last `window_size` runs and fires a separate, distinctly-worded Slack alert if at least
    # `threshold` of them were WAF-block-classified failures (only MI produces that
    # classification today; this is jurisdiction-agnostic so any future jurisdiction with the
    # same failure mode is covered automatically). Deliberately does NOT skip or delay a
    # scheduled run based on this history -- see OPEN-22's own AC5 scope note: MI already only
    # runs weekly, so skipping a scheduled attempt has unproven value and would mean less data
    # on whether the block has actually cleared.
    escalation:
      window_size: 4    # look at each jurisdiction's last N weekly runs
      threshold: 3       # escalate once >= this many of the last window_size were WAF-blocked

    scrapebot_fallback:
      enabled: true  # flipped 2026-08-03 after Phase 3 live validation (real mint + concurrency smoke test both passed)
      jurisdictions: ["mi"]

  people_refresh:
    enabled: true
    sync_day: sunday
    sync_time_utc: "10:00"     # after secondary (~06:00) and USA (~09:00) finish

# Split out from openstates_scrape (2026-07-31) — bill-document archiving to DDP-HOT used to
# run as the last step of each scrape job, gating that job's incremental-cutoff marker write on
# the archive step finishing too. A run whose archive step ran long or died left the cutoff
# stuck, making the next run slower and more likely to also miss its own archive window —
# observed live: a WA run still archiving 1h45m+ after scrape+import had already finished
# cleanly. Fully independent: each jurisdiction below archives on its own schedule, with no
# relationship to when/whether that jurisdiction's own scrape last ran.
# Same jurisdiction list as ddp-open-states's ARCHIVE_ENABLED_STATES (activate.sh) — keep in
# sync if that list ever changes.
#
# Changed 2026-08-10: each jurisdiction now runs once a week, on its own day, instead of every
# jurisdiction running concurrently every day. `us` alone has ~83k never-archived documents —
# two orders of magnitude more than any state jurisdiction — so a daily all-jurisdictions run
# let federal's fetch+extract volume dominate shared CPU/network/DDP-HOT I/O and starve the
# smaller jurisdictions' own runs. `us` gets a day entirely to itself; fl+ut and wa+va share a
# day since both pairs are already ~fully archived and do almost no work once caught up.
openstates_archive:
  enabled: true
  openstates_root: "/Users/agentsmith/Developer/repos/ddp-open-states"
  sync_time_utc: "05:00"   # shared time-of-day for every jurisdiction below; well clear of the
                           # 01:00-03:00 scrape-job start times, though overlap with a live
                           # scrape is safe by design (natural-key skip check)
  jurisdictions:
    - fl
    - ut
    - az
    - wa
    - va
    - mi
    - ma
    - al
    - us
  schedule:
    fl: monday
    ut: monday
    az: tuesday
    wa: wednesday
    va: wednesday
    mi: thursday
    ma: friday
    al: saturday
    us: sunday
  # Same ScrapeBot cookie pre-seed the scrape jobs get (secondary.scrapebot_fallback above),
  # added 2026-08-08: mint fresh WAF-passing cookies via ScrapeBot before each opted-in
  # jurisdiction's archive run, instead of relying on whatever the last scrape's pre-seed
  # left in the cache file. Best-effort — a failed mint logs a warning and the archive run
  # proceeds with existing/self-warmed cookies.
  scrapebot_fallback:
    enabled: true
    jurisdictions: ["mi"]

# VoteBot Eval Cron (plan PLAN-eval-and-cache-hit-logging.md §3)
# Runs scripts/evaluate_production.py weekly via subprocess into votebot's
# venv. Posts a Zapier alert with on_failure / on_regression /
# on_bill_history_leak flags that the Zap routes to Slack on receiver side.
# Manual trigger: POST /ddp-sync/v1/trigger/votebot-eval?days=7
votebot_eval:
  enabled: true
  frequency: weekly                  # weekly only — eval is expensive
  sync_day: sunday                   # Sunday early UTC = Saturday evening EST
  sync_time_utc: "12:00"
  days: 7                            # window passed to --days
  max_days: 30                       # hard cap accepted by manual trigger
  votebot_path: "/home/ubuntu/votebot"  # env VOTEBOT_PATH overrides this
  thresholds:
    # Set below current production baselines so first run isn't a false
    # positive. Tighten as Deploy 2 (citation prompt) lifts the baseline.
    citation_rate_floor: 0.20        # alert when citation_rate < this
    pass_rate_floor: 0.40            # alert when pass_rate < this
    delta_drop_pp: 10                # soft-alert when either rate drops by ≥ this many pp
  notifications:
    enabled: true                    # set false to suppress Zapier alerts
    alert_on_success: true           # send the green-path summary too, not just failures

# Concept-Statement Dispatch's own standalone scheduled batch job (ddp-infra
# PLAN-bill-concept-polling.md §0.4) retired SYNC-32 -- ConceptStatementSet
# generation now runs through session_pipeline_batch below, via its
# include_concept_statements option (SYNC-31). That standalone job's own
# dedup pre-check hit a real DDP_BROKER_API_BASE misconfiguration in
# production on 2026-08-16 and silently failed 25/25 dispatches with no
# alerting anywhere -- session_pipeline_runner.py's broker-base-URL handling
# is more battle-tested, and consolidating removes that whole independent
# failure surface, not just this one instance of it.

# Session-Targeted BillArtifact Batch (SYNC-9)
# =============================================
# Scheduled batch job for run_legbot_pipeline (pipelines/session_pipeline_runner.py,
# ddp-infra PLAN-bill-document-provenance.md "Step 1, scoped version") -- fills in
# whichever of the 8 BillArtifact types (bill_summary, bill_pros_cons, etc.) are
# missing for every bill in one jurisdiction/session, plus optional Organization
# Position Research and ConceptStatementSet generation (SYNC-31 -- folded in
# from the retired standalone concept_statement_dispatch job, SYNC-32; see
# this file's own git history for that job's former config block). The
# on-demand route POST /trigger/bill-artifact-generation (api/routes/triggers.py)
# is this pipeline's other real caller and works regardless of this block's
# `enabled` value.
#
# Disabled by default, deliberately -- verified 2026-08-14 directly against
# ddp-infra's PLAN-legbot.md and PLAN-bill-document-provenance.md:
#   - Phase 6 (BillArtifact dedup key): LIVE. Merged to ddp-broker-py `main`
#     2026-07-26, production RDS confirmed up to date the same day. Writes
#     from this job are safe.
#   - Phase 8 (concurrency cap, prioritization vs. interactive Agent Smith
#     traffic): NOT BUILT. The plan doc's own corrected note (2026-07-22) is
#     explicit -- there is no max_concurrent_requests cap anywhere in this
#     pipeline today, just a plain sequential loop (effective concurrency of
#     1). Nothing since the plan's last update (2026-08-10) indicates this
#     shipped.
# Flip `enabled: true` only after ddp-infra's Phase 8 concurrency work is
# confirmed live -- until then, use the on-demand trigger route for any real
# batch, which caps `limit` to 25 for the same reason.
#
# jurisdiction_iso2/session_code are a single, specific state/session (not
# "current session" auto-detection, not "all jurisdictions") and
# artifact_types is a small subset, not all 8 -- a deliberately narrow first
# scope per the plan's own "start with a small reviewed batch" rollout note,
# same spirit as the retired concept_statement_dispatch job's own
# max_bills_per_run cap.
#
# include_concept_statements: false, same as include_org_research -- per
# Ramon's 2026-08-21 direction (SYNC-31/SYNC-32), no scheduled cadence exists
# yet for ANY LegBot artifact type, concept statements included. Leave this
# false here; exercise concept-statement generation via the on-demand route
# only until a real cadence decision is made.
session_pipeline_batch:
  enabled: false
  frequency: weekly
  sync_day: sunday
  sync_time_utc: "13:00"       # after votebot_eval (12:00)
  jurisdiction_iso2: "FL"
  session_code: "2026F"
  artifact_types:
    - bill_summary
    - bill_pros_cons
  include_org_research: false
  include_concept_statements: false
  limit: 10
