# OPEN-193: ddp-sync prod stack. No Redis service of its own -- joins ddp-broker-py's existing
# network and points at its Redis container directly, on a separate logical DB (see REDIS_URL
# below) rather than standing up a second Redis instance. Requires ddp-broker-py's own stack to
# already be up (specifically its `redis` service / `ddp-broker-py_default` network).
version: "3.5"

networks:
  ddp-broker-py_default:
    external: true

# pm-review: the Dockerfile's openstates-builder stage reads a BuildKit secret
# (`--mount=type=secret,id=github_token`), but a bare `additional_contexts` entry doesn't
# supply it -- `docker compose build` needs its own explicit wiring, or the build fails at
# the git-clone step with "No such file or directory: /run/secrets/github_token". Sourced
# from an environment variable (GITHUB_PERSONAL_ACCESS_TOKEN, already required in ../.env
# for the same PAT the root ddp-open-states Dockerfile's own build already uses), not a file
# on disk -- consistent with every other secret this host already keeps in .env rather than
# a separate credential file.
secrets:
  github_token:
    environment: GITHUB_PERSONAL_ACCESS_TOKEN

services:
  ddp-sync:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
      # OPEN-248: the Dockerfile's openstates-builder stage needs requirements-openstates.txt
      # from the SEPARATE ddp-open-states repo, reached this way rather than duplicated into
      # this repo -- both checkouts already sit as siblings on this exact host (same absolute
      # path OPENSTATES_ROOT below already points at), so referencing the real file directly
      # avoids a second copy of a ~150-line pinned-dependency file that would only drift.
      additional_contexts:
        - openstates=/opt/ddp-open-states
      secrets:
        - github_token
    image: ddp-sync:prod
    env_file:
      - ../.env
    environment:
      # DB 3: ddp-broker-py's Celery broker/result backend use DB 0, its Django cache DB 1, its
      # celery_once lock backend DB 2 (apps/ddp-broker/ddpbroker/settings/base.py) -- confirmed
      # 2026-09-02 (notes/ops-handoff) before picking this one, not assumed.
      - REDIS_URL=redis://redis:6379/3
      - ENVIRONMENT=production
      - AWS_DEFAULT_REGION=us-east-1
      # OPEN-243: openstates_root is inherently per-host but sync_schedule.yaml is a single
      # file every ddp-sync host pulls identically (its own openstates_root value is the Mac
      # Studio's path). This env var wins over that shared config value -- see
      # openstates_scrape.py's _get_root(). Real path on THIS host, matching the checkout
      # cloud_scrape_trigger.py's _run_load() actually finds cloud_loader.py in.
      - OPENSTATES_ROOT=/opt/ddp-open-states
      # SYNC-51 per-task flags (notes/ops-handoff, 2026-09-02): this host owns ONLY the
      # OpenStates scrape trigger for OPEN-193's canary -- every other scheduled task ddp-sync
      # can run is explicitly disabled here so this doesn't become a second, uncoordinated
      # scheduler duplicating whatever else already runs these jobs elsewhere (no shared Redis
      # with any other ddp-sync instance -- see SYNC-11, there is no single canonical one).
      - BILL_SYNC_ENABLED=false
      - LEGISLATOR_SYNC_ENABLED=false
      - LEGISLATOR_BIO_SYNC_ENABLED=false
      - ORGANIZATION_SYNC_ENABLED=false
      - VOATZ_SYNC_ENABLED=false
      - WEBFLOW_BATCH_ENABLED=false
      - VOTEBOT_EVAL_ENABLED=false
      - API_HEALTH_CHECK_ENABLED=false
      - SESSION_PIPELINE_BATCH_ENABLED=false
      # OPENSTATES_SCRAPE_ENABLED=true (OPEN-253, 2026-09-03): flipped from the canary-era
      # false above once Ramon moved live scheduled scraping from the Mac host to this one
      # (Mac's own scrape runs stopped the same night). Registers the SIX recurring scheduled
      # jobs this flag controls (FL, WA, USA, secondary states including MI, people refresh,
      # patch apply) -- now intentional, not the accidental-enable this comment originally
      # warned about. POST /trigger/openstates-scrape/{target} (api/routes/triggers.py:825)
      # never checks this flag at all -- it's a separate, always-on code path, unaffected
      # either way.
      - OPENSTATES_SCRAPE_ENABLED=true
      # OPENSTATES_ARCHIVE_ENABLED/MI_COOKIE_PUBLISH_ENABLED: the handoff note left these as
      # "your call" (OpenStates-domain, not Voatz/Webflow/LegBot, so plausible either way) --
      # defaulted to false here too, since this host's mandate is specifically the OPEN-193
      # canary, not general OpenStates archive/MI-cookie maintenance. Flagged back on
      # notes/ops-handoff in case that call should go the other way.
      - OPENSTATES_ARCHIVE_ENABLED=true
      - MI_COOKIE_PUBLISH_ENABLED=false
      # SYNC-59: this host's own target for the Mac Studio's ddp-sync itself, over the
      # existing WireGuard mesh (same 10.0.0.8 address API-6's proxy uses, but port 8001 --
      # that's ddp-sync's own port, matching this EC2 host's own ddp-sync (also 8001);
      # 8002 on the Mac is a DIFFERENT service, its local api-v3 (config.py's
      # local_openstates_api_base default), not ddp-sync -- caught and corrected 2026-09-13
      # after initially conflating the two ports. Not a secret, just a resource address --
      # MAC_DDP_SYNC_API_KEY (the actual credential) comes from render-env.sh instead.
      # LEGBOT_SCRAPE_COMPLETION_TRIGGER_ENABLED=true (2026-09-15): flipped back on with
      # Ramon's explicit direction, alongside deploying PR #157 (OPEN-291) -- the real fix
      # for the MI archiving-lag gap that motivated the 09-14 pause (newly-introduced bills
      # no longer wait for MI's weekly archive cron; archive now fires right after scrape
      # completes). Was off 2026-09-14 -> 2026-09-15 pending that fix; also ran a real
      # one-off full-session MI LegBot dispatch against production (via the Mac's ddp-sync)
      # the same night, separate from this automated path. See notes/ops-handoff for both
      # threads. Note: this endpoint's automated caller sends X-DDP-Automated-Trigger=true,
      # which the RECEIVING side (the Mac) gates on ITS OWN copy of this same flag,
      # independent of this value -- unconfirmed whether the Mac's copy is currently true or
      # still false from the 09-14 pause ask (`mac-flag-flip-not-needed-ec2-gates-it-
      # 20260914.md` said not to touch it while EC2 stayed off, which no longer applies now
      # that EC2 is on) -- flagged to the dev agent to confirm/flip if needed.
      - LEGBOT_SCRAPE_COMPLETION_TRIGGER_ENABLED=true
      - MAC_DDP_SYNC_BASE_URL=http://10.0.0.8:8001
      # SYNC-59/SYNC-65's "known partial-rollout gap": this host's own RDS-backed api-v3
      # (OPEN-279), on the host's own network (different Docker network than this container,
      # confirmed reachable via this address, not localhost). RDS_OPENSTATES_API_KEY (the
      # credential) comes from render-env.sh instead.
      - RDS_OPENSTATES_API_BASE=http://10.0.0.11:8002
      # OPEN-290: 4th instance of the same config-override gap (PR #153) -- these three were
      # silently inert here even when set, since _load_from_env() never runs on a host where
      # Secrets Manager succeeds. Now fixed in get_settings()'s override loop; setting them
      # explicitly here (matching the Mac's real values) rather than relying on the dataclass
      # defaults, which only coincidentally match for limit/include_concept_statements and
      # not at all for artifact_types (bare default is an empty list, not the 9-type default
      # that only lives inside the dead _load_from_env() fallback).
      - LEGBOT_SCRAPE_COMPLETION_TRIGGER_ARTIFACT_TYPES=bill_summary,bill_pros_cons,bill_vote_yes_frame,bill_vote_no_frame,bill_supporting_orgs,bill_opposing_orgs,bill_impact_analysis,bill_topics,bill_changelog
      - LEGBOT_SCRAPE_COMPLETION_TRIGGER_LIMIT=10000
      - LEGBOT_SCRAPE_COMPLETION_TRIGGER_INCLUDE_CONCEPT_STATEMENTS=true
      # SYNC-89 / Wave 3 step E (2026-10-02): which Pinecone index the knowledge-base embedding
      # path (backfill endpoints and, later, the post-archive hook) writes to. Deliberately set
      # HERE, per host, and NOT in the shared `ddp-sync/credentials` secret every host reads:
      # config.py says the votebot/ddp-api instance must never enable this path, so the process
      # environment has to win over the shared secret. The code refuses the legacy
      # `votebot-large` index and an unset name. Setting it only enables the manually
      # triggered backfill endpoints; the scheduled hook stays off while
      # openstates_archive.knowledge_base_embedding.enabled is false in sync_schedule.yaml.
      # Rollback: remove this line and recreate the service.
      - KNOWLEDGE_BASE_INDEX_NAME=ddp-knowledge-base
    volumes:
      # config/sync_schedule.yaml is never baked into the image (Dockerfile only COPYs
      # pyproject.toml + src/) -- mounted read-only instead so an ordinary git pull on the host
      # (no rebuild) is enough to pick up a config change, matching how this file has always
      # been edited so far (PRs, not image rebuilds).
      - ../config:/app/config:ro
      # OPENSTATES_ROOT points _run_load() at this path (see the env var above), but setting
      # the env var alone doesn't make the HOST's /opt/ddp-open-states visible inside this
      # container's own filesystem -- found live 2026-09-02: cloud_loader.py resolved the
      # correct path but still got ENOENT, since nothing had actually bind-mounted it in yet.
      # Still needed after OPEN-248 bundled the os-update TOOLCHAIN into the image -- this
      # mount is for cloud_loader.py/cloud_collector.py's own SCRIPT FILES (the Dockerfile
      # never COPYs them; only their compiled dependencies), which _run_load() invokes as a
      # separate subprocess by path. Read-write, not :ro -- cloud_loader.py os.makedirs()'s
      # data/cache dirs under here.
      - /opt/ddp-open-states:/opt/ddp-open-states
    ports:
      - "8001:8001"
    networks:
      - ddp-broker-py_default
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/ddp-sync/v1/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
